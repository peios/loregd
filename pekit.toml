# loregd — Peios's SQLite-backed Registry Source Interface provider.
#
# One locked Go source graph produces the critical runtime, detached symbols,
# exact debug sources, third-party notices, and corresponding source. Network
# access is confined to build.vendor; build.main and test are vendor-only.

out_dir = "out"

[source_package]
name = "dev.peios.loregd-source"

[build.vendor]
command = '''
set -eu
export GOCACHE="$PEKIT_OUT/gocache"
export GOMODCACHE="$PEKIT_OUT/modcache"
export GOENV=off GOWORK=off
SRC=$(pwd -P)
BUILD="$PEKIT_OUT/source"
rm -rf "$BUILD" "$PEKIT_OUT/vendor"
mkdir -p "$GOCACHE" "$GOMODCACHE" "$BUILD" "$PEKIT_OUT/vendor"

# Keep prior package output below src/out from becoming an accidental package
# in the Go module graph. The vendor phase works from an isolated source copy
# just like the network-disabled build and test phases.
for entry in "$SRC"/* "$SRC"/.[!.]* "$SRC"/..?*; do
  test -e "$entry" || test -L "$entry" || continue
  case ${entry##*/} in
    .git|out) continue ;;
  esac
  cp -a "$entry" "$BUILD/"
done
cd "$BUILD"

go mod verify
go mod vendor -o "$PEKIT_OUT/vendor"
test -s "$PEKIT_OUT/vendor/modules.txt"
'''

[build.vendor.dependencies.peipkg]
"org.golang.go"               = ">= 1.26.5, < 1.27"
"org.mozilla.ca-certificates" = "*"
"org.git.kernel.dash"         = "*"
"org.gnu.coreutils"           = "*"

[build.vendor.dependencies.apt]
golang-go       = ">= 2:1.26~"
ca-certificates = "*"
dash            = "*"
coreutils       = "*"

[build.main]
needs = ["vendor"]
command = '''
set -eu
set -o pipefail 2>/dev/null || true

SRC=$(pwd -P)
BUILD="$PEKIT_OUT/build"
DEBUG_PREFIX="/usr/src/debug/dev.peios.loregd-$PEKIT_VERSION"
DEBUG_ROOT="$PEKIT_OUT$DEBUG_PREFIX"
LICENSE_ROOT="$PEKIT_OUT/licenses"

for tool in go find grep sed sort cmp readelf objcopy strip gzip python3 stat; do
  command -v "$tool" >/dev/null || {
    echo "loregd: missing required build tool: $tool" >&2
    exit 1
  }
done

# Build from a private copy so local builds never leave a vendor tree or cache
# in the source checkout. The only dependency source admitted is the graph
# generated from go.mod/go.sum by build.vendor.
rm -rf "$BUILD"
mkdir -p "$BUILD" "$PEKIT_OUT/usr/sbin" "$PEKIT_OUT/var/state/loregd"
chmod 0700 "$PEKIT_OUT/var/state/loregd"
# Pekit's output root may live below the local source checkout. Copy each
# top-level source entry separately so the build never recurses into its own
# output, while retaining dotfiles that can affect the Go build.
for entry in "$SRC"/* "$SRC"/.[!.]* "$SRC"/..?*; do
  test -e "$entry" || test -L "$entry" || continue
  case ${entry##*/} in
    .git|out) continue ;;
  esac
  cp -a "$entry" "$BUILD/"
done
rm -rf "$BUILD/vendor" "$BUILD/loregd"
cp -a "$PEKIT_VENDOR_OUT/vendor" "$BUILD/vendor"

export CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1
export GOENV=off GOTOOLCHAIN=auto GOWORK=off GOPROXY=off GOSUMDB=sum.golang.org
export GOFLAGS='-mod=vendor -trimpath -buildvcs=false'
export GOMODCACHE="$PEKIT_VENDOR_OUT/modcache"
export GOCACHE="$PEKIT_OUT/gocache-a"
mkdir -p "$GOCACHE"

cd "$BUILD"
go build -buildmode=pie -ldflags='-B gobuildid -bindnow' \
  -o "$PEKIT_OUT/usr/sbin/loregd" .
test -x "$PEKIT_OUT/usr/sbin/loregd"

mkdir -p "$PEKIT_OUT/usr/share/man/man8"
gzip -9n < "$SRC/man/loregd.8" > "$PEKIT_OUT/usr/share/man/man8/loregd.8.gz"
gzip -t "$PEKIT_OUT/usr/share/man/man8/loregd.8.gz"

# Go's DWARF 5 is newer than the packaged debugedit understands. Its trimpath
# output already uses stable import paths, so collect exactly the source files
# selected by `go list -deps` and fail closed if any vendored module lacks a
# distributable licence notice.
python3 "$SRC/tools/collect-go-metadata.py" \
  --debug-root "$DEBUG_ROOT" \
  --licence-root "$LICENSE_ROOT" \
  .
test -n "$(find "$DEBUG_ROOT" -type f -print -quit)"
test -n "$(find "$LICENSE_ROOT" -type f -print -quit)"

# Recompile through an independent cache and require byte-identical output.
REPRO="$PEKIT_OUT/repro-loregd"
export GOCACHE="$PEKIT_OUT/gocache-b"
mkdir -p "$GOCACHE"
go build -buildmode=pie -ldflags='-B gobuildid -bindnow' -o "$REPRO" .
cmp "$PEKIT_OUT/usr/sbin/loregd" "$REPRO"

ELF="$PEKIT_OUT/usr/sbin/loregd"
BUILD_ID=$(readelf -n "$ELF" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
test -n "$BUILD_ID"
FIRST=$(printf %s "$BUILD_ID" | cut -c1-2)
REST=$(printf %s "$BUILD_ID" | cut -c3-)
DEBUG="$PEKIT_OUT/debug/usr/lib/debug/.build-id/$FIRST/$REST.debug"
mkdir -p "$(dirname "$DEBUG")"
objcopy --only-keep-debug "$ELF" "$DEBUG"
strip --strip-unneeded "$ELF"
objcopy --add-gnu-debuglink="$DEBUG" "$ELF"

rm -rf "$BUILD" "$REPRO" "$PEKIT_OUT/gocache-a" "$PEKIT_OUT/gocache-b"
'''

[build.main.dependencies.peipkg]
"org.golang.go"       = ">= 1.26.5, < 1.27"
"org.git.kernel.dash" = "*"
"org.gnu.coreutils"   = "*"
"org.gnu.diffutils"   = "*"
"org.gnu.findutils"   = "*"
"org.gnu.grep"        = "*"
"org.gnu.sed"         = "*"
"org.gnu.binutils"    = "*"
"org.gnu.gzip"        = "*"
"org.python.python3"  = "*"

[build.main.dependencies.apt]
golang-go = ">= 2:1.26~"
dash      = "*"
coreutils = "*"
diffutils = "*"
findutils = "*"
grep      = "*"
sed       = "*"
binutils  = "*"
gzip      = "*"
python3   = "*"

[test]
gate = true
needs = ["main"]
command = '''
set -eu
SRC=$(pwd -P)
BUILD="$PEKIT_OUT/test-build"
rm -rf "$BUILD"
mkdir -p "$BUILD"
for entry in "$SRC"/* "$SRC"/.[!.]* "$SRC"/..?*; do
  test -e "$entry" || test -L "$entry" || continue
  case ${entry##*/} in
    .git|out) continue ;;
  esac
  cp -a "$entry" "$BUILD/"
done
rm -rf "$BUILD/vendor" "$BUILD/loregd"
cp -a "$PEKIT_VENDOR_OUT/vendor" "$BUILD/vendor"
export CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1
export GOENV=off GOTOOLCHAIN=auto GOWORK=off GOPROXY=off GOSUMDB=sum.golang.org
export GOFLAGS='-mod=vendor -trimpath -buildvcs=false'
export GOMODCACHE="$PEKIT_VENDOR_OUT/modcache"
export GOCACHE="$PEKIT_OUT/gocache"
mkdir -p "$GOCACHE"
(cd "$BUILD" && go test -count=1 ./...)
rm -rf "$BUILD" "$GOCACHE"

# Validate the exact staged package output produced by build.main.
SRC=$(pwd -P)
PEKIT_OUT="$PEKIT_MAIN_OUT"
BUILD="$PEKIT_OUT/build"
ELF="$PEKIT_OUT/usr/sbin/loregd"
BUILD_ID=$(readelf -n "$ELF" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)
DEBUG="$PEKIT_OUT/usr/lib/debug/.build-id/$(printf %s "$BUILD_ID" | cut -c1-2)/$(printf %s "$BUILD_ID" | cut -c3-).debug"
# Installed-payload smoke tests: the shipped executable runs, rejects an empty
# command line cleanly, and the package-owned mutable-state skeleton is private.
if "$ELF" >"$PEKIT_OUT/no-args.stdout" 2>"$PEKIT_OUT/no-args.stderr"; then
  echo "loregd: empty command line unexpectedly succeeded" >&2
  exit 1
fi
test ! -s "$PEKIT_OUT/no-args.stdout"
grep -F 'argument error: no hive arguments provided' "$PEKIT_OUT/no-args.stderr" >/dev/null
test "$(stat -c %a "$PEKIT_OUT/var/state/loregd")" = 700
rm -f "$PEKIT_OUT/no-args.stdout" "$PEKIT_OUT/no-args.stderr"

# The pure-Go payload is a self-contained PIE: it has a dynamic loader for
# ASLR but no shared-library dependency. Require full relocation hardening,
# non-executable stack, intact split debug data, module provenance, and no
# checkout/build-root paths.
readelf -h "$ELF" | grep -Eq 'Type:[[:space:]]+DYN'
readelf -lW "$ELF" | grep -q 'GNU_RELRO'
readelf -lW "$ELF" | grep -Eq 'GNU_STACK[[:space:]].*RW[[:space:]]'
! readelf -lW "$ELF" | grep -Eq 'GNU_STACK[[:space:]].*RWE'
readelf -dW "$ELF" | grep -q 'BIND_NOW'
readelf -dW "$ELF" | grep -Eq 'FLAGS_1.*PIE'
! readelf -dW "$ELF" 2>/dev/null | grep -Eq '(NEEDED|RPATH|RUNPATH|TEXTREL)'
! readelf -SW "$ELF" | grep -q '\.debug_info'
! readelf -SW "$ELF" | grep -q '\.symtab'
test -s "$DEBUG"
readelf -SW "$DEBUG" | grep -q '\.debug_info'
test "$(readelf -n "$DEBUG" | sed -n 's/^[[:space:]]*Build ID: //p' | head -1)" = "$BUILD_ID"
go version -m "$ELF" | grep -Eq '^[[:space:]]*path[[:space:]]+github\.com/peios/loregd$'
go version -m "$ELF" | grep -Eq '^[[:space:]]*dep[[:space:]]+modernc\.org/sqlite[[:space:]]+v1\.48\.1'
for forbidden in "$SRC" "$BUILD" "$PEKIT_OUT_BASE" "$PEKIT_WORKSPACE_ROOT"; do
  ! grep -aF "$forbidden" "$ELF" "$DEBUG" >/dev/null
done

'''

[test.dependencies.peipkg]
"org.golang.go"       = ">= 1.26.5, < 1.27"
"org.git.kernel.dash" = "*"
"org.gnu.coreutils"   = "*"
"org.gnu.diffutils"   = "*"
"org.gnu.findutils"   = "*"
"org.gnu.grep"        = "*"
"org.gnu.sed"         = "*"
"org.gnu.binutils"    = "*"
"org.gnu.gzip"        = "*"
"org.python.python3"  = "*"

[test.dependencies.apt]
golang-go = ">= 2:1.26~"
dash      = "*"
coreutils = "*"
diffutils = "*"
findutils = "*"
grep      = "*"
sed       = "*"
binutils  = "*"
gzip      = "*"
python3   = "*"
