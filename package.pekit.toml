# Shared metadata for Loregd's runtime, detached symbols, debug sources, and
# generated corresponding source. The complete linked Go closure is covered:
# Peios and several modules are MIT; the Go standard library and modernc stack
# are BSD-3-Clause; modernc's bundled libc notices also carry BSD-2-Clause.

format = "peipkg"

[package]
version       = "{{version}}-1"
architecture  = "x86_64"
license       = "MIT AND BSD-2-Clause AND BSD-3-Clause"
license_class = "free"
homepage      = "https://github.com/peios/loregd"
